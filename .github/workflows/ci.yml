name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
  pull_request:
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Test macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Run unit and integration tests
        run: zig build test -Dportable-system-goldens=true

      - name: Run Kitty keyboard conformance ratchet
        run: zig build kitty-keyboard-conformance

      - name: Run terminal conformance ratchet
        run: zig build esctest

      - name: Build native app
        run: zig build -Doptimize=ReleaseSafe
