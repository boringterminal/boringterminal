name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
  pull_request:
    paths-ignore:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Test macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check macOS signing policy
        run: /bin/bash scripts/test-macos-signing.sh

      - name: Run unit and integration tests
        id: tests
        # Keep compatibility codecs out of the persistent daemon.
        run: |
          python3 scripts/check-daemon-imports.py
          zig build test -Dportable-system-goldens=true 2>&1 | tee "${RUNNER_TEMP}/boringterminal-tests.log"

      - name: Report test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        run: python3 scripts/report-test-failure.py "${RUNNER_TEMP}/boringterminal-tests.log"

      - name: Run Kitty keyboard conformance ratchet
        run: zig build kitty-keyboard-conformance

      - name: Run terminal conformance ratchet
        run: zig build esctest

      - name: Build native app
        run: zig build -Doptimize=ReleaseSafe
