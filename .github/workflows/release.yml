name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Publish universal macOS release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Validate tag and source versions
        run: ./scripts/package-macos.sh --check "${GITHUB_REF_NAME}"

      - name: Check macOS signing policy
        run: /bin/bash scripts/test-macos-signing.sh

      - name: Run unit and integration tests
        run: python3 scripts/check-daemon-imports.py && zig build test -Dportable-system-goldens=true

      - name: Run Kitty keyboard conformance ratchet
        run: zig build kitty-keyboard-conformance

      - name: Run terminal conformance ratchet
        run: zig build esctest

      - name: Build universal DMG
        run: ./scripts/package-macos.sh "${GITHUB_REF_NAME}"

      - name: Verify disk image
        run: hdiutil verify zig-out/release/*.dmg

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(zig-out/release/*.dmg zig-out/release/*.sha256)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            release_notice=$'> [!IMPORTANT]\n> This build is ad-hoc signed and not notarized. macOS may require **Open Anyway** on first launch. See the [installation instructions](https://boringterminal.com/docs/install/).'
            notes_file="${RUNNER_TEMP}/release-notes.md"
            printf '%s\n\n' "$release_notice" > "$notes_file"
            if [[ -f "docs/releases/${GITHUB_REF_NAME}.md" ]]; then
              cat "docs/releases/${GITHUB_REF_NAME}.md" >> "$notes_file"
            fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --notes-file "$notes_file" \
              --title "Boring Terminal ${GITHUB_REF_NAME#v}"
          fi
