name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Publish universal macOS release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Validate tag and source versions
        run: ./scripts/package-macos.sh --check "${GITHUB_REF_NAME}"

      - name: Run unit and integration tests
        run: zig build test -Dportable-system-goldens=true

      - name: Run Kitty keyboard conformance ratchet
        run: zig build kitty-keyboard-conformance

      - name: Run terminal conformance ratchet
        run: zig build esctest

      - name: Build universal DMG
        run: ./scripts/package-macos.sh "${GITHUB_REF_NAME}"

      - name: Verify disk image
        run: hdiutil verify zig-out/release/*.dmg

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(zig-out/release/*.dmg zig-out/release/*.sha256)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Boring Terminal ${GITHUB_REF_NAME#v}"
          fi
